server:
  port: 8081

spring:
  application:
    name: cuenta-service

  config:
    import: optional:configserver:http://localhost:8888

  # H2 Database
  datasource:
    url: jdbc:h2:mem:cuenta_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

# JWT Configuration
jwt:
  secret: banco-xyz-clave-super-secreta-para-firmar-tokens-jwt-2026
  expiration: 36000000

# Logging
logging:
  level:
    com.bancoxyz: DEBUG