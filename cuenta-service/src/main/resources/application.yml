server:
  port: 8081

spring:
  application:
    name: cuenta-service

  config:
    import: optional:configserver:http://localhost:8888

  # JMS - HABILITAR TOPIC (Publish/Subscribe)
  jms:
    pub-sub-domain: true

  # JMS / ActiveMQ
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    packages:
      trust-all: true
    pool:
      enabled: true
      max-connections: 10

  # H2 Database
  datasource:
    url: jdbc:h2:mem:cuenta_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

jwt:
  secret: banco-xyz-clave-super-secreta-para-firmar-tokens-jwt-2026
  expiration: 36000000

logging:
  level:
    com.bancoxyz: DEBUG
    org.apache.activemq: INFO