server:
  port: 8090

spring:
  application:
    name: batch-service

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      schema: classpath:org/springframework/batch/core/schema-h2.sql

  datasource:
    url: jdbc:h2:mem:batch_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-h2.sql

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,batch

batch:
  job:
    to-run: estadosCuentaAnualesJob

logging:
  level:
    com.bancoxyz: DEBUG
    org.springframework.batch: INFO
    org.springframework.jdbc.datasource.init: DEBUG